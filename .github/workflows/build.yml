name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as the latest release (easy to download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ScreenRecorder.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScreenRecorder.apk \
            --target "${{ github.sha }}" \
            --title "Screen Recorder (latest build)" \
            --notes "Download ScreenRecorder.apk on your phone and open it to install. Build #${{ github.run_number }}."
